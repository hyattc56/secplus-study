<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security+ Sentinel — SY0-701</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1117;--bg2:#161b27;--card:#1a1f2e;--card2:#1e2436;
    --border:#252d3d;--border2:#2e3750;
    --text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8;--white:#ffffff;
    --accent:#6366f1;--accent-h:#7c7ffc;--accent-g:linear-gradient(135deg,#6366f1,#818cf8);
    --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--purple:#a855f7;--cyan:#06b6d4;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  #root{min-height:100vh;display:flex;flex-direction:column}
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

  @keyframes spin   {to{transform:rotate(360deg)}}
  @keyframes fadeUp {from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn {from{opacity:0}to{opacity:1}}
  @keyframes pulse  {0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
  @keyframes tooltipIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

  .anim-up{animation:fadeUp .3s ease both}
  .anim-in{animation:fadeIn .2s ease both}

  /* ── NAVBAR ── */
  .navbar{position:sticky;top:0;z-index:200;background:rgba(15,17,23,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);height:60px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}

  /* ── CARDS ── */
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .card-p{padding:20px}

  /* ── BUTTONS ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;border-radius:12px;border:none;cursor:pointer;transition:all .18s ease;padding:11px 20px;letter-spacing:-.01em;white-space:nowrap;line-height:1}
  .btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
  .btn-primary{background:var(--accent-g);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.35)}
  .btn-primary:hover{filter:brightness(1.1);box-shadow:0 6px 24px rgba(99,102,241,.5);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--muted2);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--card);color:var(--text);border-color:var(--border2)}
  .btn-danger{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
  .btn-danger:hover{background:rgba(239,68,68,.22)}
  .btn-success{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.25)}
  .btn-success:hover{background:rgba(34,197,94,.22)}

  /* ── MODE SELECTOR ── */
  .mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .mode-btn{background:var(--card2);border:2px solid var(--border);border-radius:14px;padding:20px 12px 16px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:10px;font-family:inherit}
  .mode-btn:hover{border-color:var(--border2);background:var(--card)}
  .mode-btn.active{border-color:var(--accent);background:rgba(99,102,241,.1);box-shadow:0 0 0 1px var(--accent) inset}
  .mode-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(255,255,255,.05)}
  .mode-btn.active .mode-icon{background:rgba(99,102,241,.2)}
  .mode-label{font-size:13px;font-weight:600;color:var(--muted2)}
  .mode-btn.active .mode-label{color:var(--white)}

  /* ── CHIPS ── */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;background:var(--card2);border:1px solid var(--border2);color:var(--muted2);cursor:pointer;transition:all .15s}
  .chip:hover{background:var(--border2);color:var(--text)}
  .chip.active{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.5);color:#818cf8;font-weight:600}

  /* ── INPUT ── */
  .topic-input{width:100%;padding:14px 16px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--border2);color:var(--white);font-family:inherit;font-size:15px;font-weight:500;outline:none;transition:border-color .18s}
  .topic-input:focus{border-color:var(--accent)}
  .topic-input::placeholder{color:var(--muted)}

  /* ── GEN BTN ── */
  .gen-btn{width:100%;padding:16px;font-size:16px;border-radius:14px;background:var(--accent-g);color:#fff;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 24px rgba(99,102,241,.4);transition:all .2s;font-family:inherit;letter-spacing:-.01em}
  .gen-btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 8px 32px rgba(99,102,241,.5)}
  .gen-btn:disabled{opacity:.5;cursor:not-allowed}

  /* ── SCORE ── */
  .score-row{display:flex;align-items:center;gap:12px}
  .score-track{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;min-width:60px}
  .score-fill{height:100%;border-radius:3px;transition:width .5s ease}

  /* ── FLASHCARD ── */
  .flashcard{border-radius:18px;min-height:210px;padding:32px 28px;cursor:pointer;position:relative;overflow:visible;display:flex;flex-direction:column;justify-content:center;transition:transform .15s,box-shadow .15s;border:1.5px solid var(--border2);background:var(--card2)}
  .flashcard:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .flashcard.front{background:linear-gradient(135deg,rgba(99,102,241,.08) 0%,var(--card2) 100%)}
  .flashcard.back{background:linear-gradient(135deg,rgba(34,197,94,.06) 0%,var(--card2) 100%)}

  /* ── QUIZ OPTS ── */
  .opt{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;transition:all .18s}
  .opt:hover:not(.locked){border-color:var(--border2);background:var(--card2)}
  .opt.selected{border-color:rgba(99,102,241,.6);background:rgba(99,102,241,.08)}
  .opt.correct{border-color:rgba(34,197,94,.6);background:rgba(34,197,94,.07)}
  .opt.wrong{border-color:rgba(239,68,68,.6);background:rgba(239,68,68,.07)}
  .opt-letter{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--border2);color:var(--muted2);transition:all .18s}
  .opt.selected .opt-letter{background:var(--accent);color:#fff}
  .opt.correct  .opt-letter{background:var(--green);color:#000}
  .opt.wrong    .opt-letter{background:var(--red);color:#fff}

  /* ── MISC ── */
  .dot-row{display:flex;gap:5px;align-items:center}
  .dot{height:4px;border-radius:2px;transition:all .3s;background:var(--border2)}
  .spinner{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite}
  .section-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:20px}
  .pill-accent{background:rgba(99,102,241,.15);color:#818cf8;border:1px solid rgba(99,102,241,.3)}
  .divider{height:1px;background:var(--border);margin:0}
  .mnem-chip{padding:6px 14px;border-radius:10px;font-size:13px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:var(--green)}
  .exam-tip{padding:14px 16px;border-radius:12px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.6;color:var(--text)}
  .gdot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;flex-shrink:0}
  .domain-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;background:var(--card2);border:1px solid var(--border2);color:var(--muted2)}
  .domain-badge:hover{border-color:var(--border2);color:var(--text);background:var(--border2)}
  .domain-badge.active{border-color:rgba(99,102,241,.5);background:rgba(99,102,241,.12);color:#818cf8}
  .result-pct{font-size:80px;font-weight:900;letter-spacing:-.04em;line-height:1}
  .prog{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
  .prog-fill{height:100%;border-radius:2px;transition:width .4s ease;background:linear-gradient(90deg,var(--accent),#818cf8)}
  @media(max-width:480px){.mode-label{display:none}.mode-btn{padding:16px 8px}}

  /* ══════════════════════════════════════════════
     TERM HIGHLIGHTING & TOOLTIP
  ══════════════════════════════════════════════ */
  .term {
    color: #a5b4fc;
    border-bottom: 1px dotted rgba(165,180,252,.5);
    cursor: help;
    position: relative;
    display: inline;
    font-weight: inherit;
    transition: color .15s, border-color .15s;
  }
  .term:hover { color: #c4b5fd; border-bottom-color: #c4b5fd; }

  /* Unknown acronyms get a distinct amber style */
  .term-acronym {
    color: #fbbf24 !important;
    border-bottom: 1px dotted rgba(251,191,36,.5) !important;
  }
  .term-acronym:hover { color: #fcd34d !important; border-bottom-color: #fcd34d !important; }

  /* Tooltip bubble */
  .term-tooltip {
    position: fixed;
    z-index: 9999;
    max-width: 280px;
    min-width: 180px;
    background: #1e2436;
    border: 1px solid rgba(165,180,252,.35);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 16px 48px rgba(0,0,0,.6), 0 0 0 1px rgba(165,180,252,.08);
    pointer-events: none;
    animation: tooltipIn .18s ease both;
  }
  .tt-term {
    font-size: 11px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; color: #a5b4fc; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .tt-term::before { content:''; display:inline-block; width:5px; height:5px; border-radius:50%; background:#a5b4fc; flex-shrink:0; }
  .tt-body { font-size: 13px; line-height: 1.55; color: var(--text); }
  .tt-type {
    margin-top: 7px; font-size: 10px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ─── GLOSSARY ─────────────────────────────────────────────────────────────────

// Build glossary map (term -> {def, type}) sorted by length descending
const GLOSSARY = GLOSSARY_RAW
  .sort((a,b) => b[0].length - a[0].length)
  .map(([term, def, type]) => ({ term, def, type, re: new RegExp(`\\b(${term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b`, 'gi') }));

// ─── ACRONYM REGEX — matches 2-6 uppercase letters (optionally with digits/hyphens) ──
const ACRONYM_RE = /\b([A-Z][A-Z0-9\-]{1,7})\b/g;

// ─── AI ACRONYM CACHE — persists across renders ───────────────────────────────
const _acronymCache = {};

async function lookupAcronym(acronym) {
  if (_acronymCache[acronym]) return _acronymCache[acronym];
  // Check glossary first (instant)
  const glossaryHit = GLOSSARY_RAW.find(([t]) => t.toUpperCase() === acronym.toUpperCase());
  if (glossaryHit) {
    const result = { term: glossaryHit[0], def: glossaryHit[1], type: glossaryHit[2], fromGlossary: true };
    _acronymCache[acronym] = result;
    return result;
  }
  // Otherwise ask Claude
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:200,
        messages:[{ role:"user", content:
          `What does the acronym "${acronym}" mean in the context of CompTIA Security+ SY0-701 / cybersecurity?\n` +
          `Respond ONLY with valid JSON (no markdown):\n{"term":"Full expanded name","def":"One concise sentence definition","type":"Category (e.g. Protocol, Tool, Framework, Attack, Standard, Concept)"}\n` +
          `If "${acronym}" is not a cybersecurity acronym, respond with: {"term":"${acronym}","def":"Not a recognized cybersecurity acronym.","type":"Unknown"}`
        }]
      })
    });
    const data = await res.json();
    const text = data.content?.find(b=>b.type==="text")?.text||"{}";
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
    _acronymCache[acronym] = parsed;
    return parsed;
  } catch {
    const fallback = { term: acronym, def: "Could not load definition.", type: "Unknown" };
    _acronymCache[acronym] = fallback;
    return fallback;
  }
}

// ─── PARSE TEXT → SEGMENTS ────────────────────────────────────────────────────
function parseSegments(text) {
  if (!text) return [];
  const matched = [];

  // 1. Glossary terms (multi-word + single, pre-sorted longest first)
  for (const entry of GLOSSARY) {
    let m;
    entry.re.lastIndex = 0;
    while ((m = entry.re.exec(text)) !== null) {
      const start = m.index, end = m.index + m[0].length;
      if (!matched.some(x => start < x.end && end > x.start))
        matched.push({ start, end, word: m[0], def: entry.def, type: entry.type, term: entry.term, isAcronym: false });
    }
  }

  // 2. Any remaining uppercase acronym not already covered
  let ma;
  ACRONYM_RE.lastIndex = 0;
  while ((ma = ACRONYM_RE.exec(text)) !== null) {
    const start = ma.index, end = ma.index + ma[0].length;
    // Skip if already matched by glossary
    if (matched.some(x => start < x.end && end > x.start)) continue;
    // Skip very common non-acronym uppercase words
    const skip = new Set(["I","A","OK","OR","IF","AND","BUT","NOT","THE","FOR","ARE","WAS","HAS","HAD","ITS","CAN","MAY","GET"]);
    if (skip.has(ma[0])) continue;
    matched.push({ start, end, word: ma[0], term: ma[0], def: null, type: null, isAcronym: true });
  }

  matched.sort((a,b) => a.start - b.start);

  const parts = [];
  let cursor = 0;
  for (const m of matched) {
    if (m.start > cursor) parts.push({ kind:'text', content: text.slice(cursor, m.start) });
    parts.push({ kind:'term', ...m });
    cursor = m.end;
  }
  if (cursor < text.length) parts.push({ kind:'text', content: text.slice(cursor) });
  return parts;
}

// ─── RICH TEXT ────────────────────────────────────────────────────────────────
function RichText({ text, style, className, tag = "span" }) {
  if (!text) return null;
  const parts = parseSegments(text);

  const handleActivate = async (e, item) => {
    e.stopPropagation();
    const rect = e.currentTarget.getBoundingClientRect();
    let x = rect.left;
    let y = rect.bottom + 10;
    if (x + 300 > window.innerWidth) x = Math.max(8, window.innerWidth - 305);
    if (y + 160 > window.innerHeight) y = Math.max(8, rect.top - 168);

    if (!item.isAcronym) {
      // Known glossary term — show immediately, no fetch needed
      showTooltip({ x, y, term: item.term, def: item.def, type: item.type, loading: false });
    } else {
      // Unknown acronym — show spinner, then fill in after fetch
      const tag = item.word;
      showTooltip({ x, y, acronym: tag, term: null, def: null, type: null, loading: true });
      const result = await lookupAcronym(tag);
      // Only update if the bubble is still showing the same acronym
      const bubble = document.getElementById('tt-bubble');
      if (bubble) {
        showTooltip({ x, y, term: result.term, def: result.def, type: result.type, loading: false });
      }
    }
  };

  const children = parts.map((p, i) =>
    p.kind === 'text'
      ? p.content
      : <span
          key={i}
          className={`term${p.isAcronym ? " term-acronym" : ""}`}
          onClick={e => handleActivate(e, p)}
          onMouseEnter={e => handleActivate(e, p)}
        >{p.content}</span>
  );

  return React.createElement(tag, { style, className }, ...children);
}

async function callClaude(prompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:prompt}]}),
  });
  const data = await res.json();
  const text = data.content?.find(b=>b.type==="text")?.text||"";
  return JSON.parse(text.replace(/```json|```/g,"").trim());
}

    setLoading(false);
  },[domain,topic]);
  useEffect(()=>{load();},[load]);

  const flip=()=>{if(fading)return;setFading(true);setTimeout(()=>{setFlipped(f=>!f);setFading(false);},120);};
  const next=(ok)=>{
    setScores(s=>({...s,correct:s.correct+(ok?1:0),wrong:s.wrong+(ok?0:1)}));
    setFlipped(false);
    setTimeout(()=>setIdx(i=>(i+1)%cards.length),180);
  };

  if(loading) return <Spinner label="Building flashcards…"/>;
  if(error)   return <Err msg={error} onRetry={load}/>;
  if(!cards?.length) return null;
  const card=cards[idx];

  return (
    <div className="anim-up" style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div className="dot-row">{cards.map((_,i)=><div key={i} className="dot" style={{width:i===idx?22:8,background:i===idx?"var(--accent)":"var(--border2)"}}/>)}</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <TermLegend/>
          <button className="btn btn-ghost" style={{padding:"6px 14px",fontSize:12}} onClick={load}>↻ New Set</button>
        </div>
      </div>

      <div className={`flashcard ${flipped?"back":"front"}`} style={{opacity:fading?0:1,transition:"opacity .12s"}} onClick={flip}>
        <p style={{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:flipped?"var(--green)":"var(--accent-h)",marginBottom:12}}>
          {flipped?"📖 Definition":"🔤 Term"}
        </p>
        <RichText text={flipped?card.back:card.front} style={{fontSize:flipped?15:20,fontWeight:flipped?400:700,color:"var(--white)",lineHeight:1.55,letterSpacing:flipped?0:"-.01em",display:"block"}} tag="div"/>
        {flipped && card.examWatch && (
          <div style={{marginTop:20,padding:"12px 14px",borderRadius:10,background:"rgba(245,158,11,.08)",border:"1px solid rgba(245,158,11,.22)",display:"flex",gap:10,alignItems:"flex-start"}}>
            <span style={{fontSize:15,flexShrink:0}}>⚡</span>
            <div>
              <p style={{fontSize:10,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--yellow)",marginBottom:4}}>Exam Watch</p>
              <RichText text={card.examWatch} style={{fontSize:13,color:"var(--text)",lineHeight:1.55,display:"block"}} tag="div"/>
            </div>
          </div>
        )}
        <p style={{fontSize:12,color:"var(--muted)",marginTop:18,textAlign:"center"}}>click to {flipped?"see term":"reveal answer"}</p>
      </div>

      {flipped?(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <button className="btn btn-danger" style={{padding:"14px",fontSize:14}} onClick={()=>next(false)}>✗ Still Learning</button>
          <button className="btn btn-success" style={{padding:"14px",fontSize:14}} onClick={()=>next(true)}>✓ Got It</button>
        </div>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <button className="btn btn-ghost" onClick={()=>{setFlipped(false);setIdx(i=>i===0?cards.length-1:i-1);}}>← Prev</button>
          <button className="btn btn-ghost" onClick={()=>{setFlipped(false);setIdx(i=>(i+1)%cards.length);}}>Next →</button>
        </div>
      )}
    </div>
  );
}

// ─── CHEAT SHEET ──────────────────────────────────────────────────────────────
function CheatSheet({domain,topic}) {
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);setError(null);setData(null);
    try{setData(await callClaude(buildPrompt("cheatsheet",domain,topic)));}
    catch{setError("Couldn't generate cheat sheet.");}
    setLoading(false);
  },[domain,topic]);
  useEffect(()=>{load();},[load]);

  if(loading) return <Spinner label="Building cheat sheet…"/>;
  if(error)   return <Err msg={error} onRetry={load}/>;
  if(!data)   return null;

  return (
    <div className="anim-up" style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <TermLegend/>
        <button className="btn btn-ghost" style={{padding:"6px 14px",fontSize:12}} onClick={load}>↻ Regenerate</button>
      </div>

      {/* Summary */}
      <div className="card card-p" style={{background:"linear-gradient(135deg,rgba(99,102,241,.07),var(--card))"}}>
        <p className="section-label" style={{marginBottom:10,color:"#818cf8"}}>📌 Overview</p>
        <RichText text={data.summary} style={{fontSize:14,lineHeight:1.75,color:"var(--text)",display:"block"}} tag="div"/>
      </div>

      {/* Key points */}
      <div className="card">
        <div className="card-p" style={{paddingBottom:8}}>
          <p className="section-label" style={{color:"var(--purple)"}}>🔑 Key Concepts</p>
        </div>
        <div className="divider"/>
        <div style={{padding:"8px 20px 16px"}}>
          {data.keyPoints?.map((pt,i)=>(
            <div key={i} style={{display:"flex",gap:14,padding:"12px 0",borderBottom:i<data.keyPoints.length-1?"1px solid var(--border)":"none"}}>
              <div style={{width:26,height:26,borderRadius:7,background:"rgba(168,85,247,.12)",border:"1px solid rgba(168,85,247,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:"var(--purple)",flexShrink:0}}>{i+1}</div>
              <RichText text={pt} style={{fontSize:14,lineHeight:1.6,color:"var(--text)",paddingTop:3,display:"block"}} tag="div"/>
            </div>
          ))}
        </div>
      </div>

      {/* Mnemonic */}
      {data.mnemonic&&(
        <div className="card card-p" style={{background:"linear-gradient(135deg,rgba(34,197,94,.06),var(--card))"}}>
          <p className="section-label" style={{marginBottom:12,color:"var(--green)"}}>🧠 Memory Device</p>
          <p style={{fontSize:20,fontWeight:800,color:"var(--green)",letterSpacing:"-.01em",marginBottom:14}}>"{data.mnemonic.phrase}"</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {data.mnemonic.breakdown?.map((b,i)=>(
              <span key={i} className="mnem-chip"><strong>{b.letter}</strong> <span style={{color:"var(--muted2)",fontWeight:400,fontSize:12}}>→ {b.stands}</span></span>
            ))}
          </div>
        </div>
      )}

      {/* Exam Watch */}
      <div className="card card-p">
        <p className="section-label" style={{marginBottom:12,color:"var(--yellow)"}}>⚡ Exam Watch Tips</p>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {data.examWatch?.map((tip,i)=>(
            <div key={i} className="exam-tip">
              <span style={{flexShrink:0,fontSize:15}}>💡</span>
              <RichText text={tip} tag="div" style={{display:"block"}}/>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
function Quiz({domain,topic,scores,setScores}) {
  const [qs,setQs]=useState(null);
  const [cur,setCur]=useState(0);
  const [sel,setSel]=useState(null);
  const [rev,setRev]=useState(false);
  const [done,setDone]=useState(false);
  const [sess,setSess]=useState({c:0,w:0});
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);setError(null);setQs(null);
    setCur(0);setSel(null);setRev(false);setDone(false);setSess({c:0,w:0});
    try{setQs(await callClaude(buildPrompt("quiz",domain,topic)));}
    catch{setError("Couldn't generate quiz.");}
    setLoading(false);
  },[domain,topic]);
  useEffect(()=>{load();},[load]);

  const submit=()=>{
    if(sel===null)return;setRev(true);
    const ok=sel===qs[cur].correct;
    setSess(s=>({c:s.c+(ok?1:0),w:s.w+(ok?0:1)}));
    setScores(s=>({correct:s.correct+(ok?1:0),wrong:s.wrong+(ok?0:1)}));
  };
  const next=()=>{if(cur+1>=qs.length){setDone(true);return;}setCur(c=>c+1);setSel(null);setRev(false);};

  if(loading) return <Spinner label="Generating quiz…"/>;
  if(error)   return <Err msg={error} onRetry={load}/>;
  if(!qs?.length) return null;

  if(done){
    const pct=Math.round((sess.c/qs.length)*100);
    const col=pct>=80?"var(--green)":pct>=60?"var(--yellow)":"var(--red)";
    return (
      <div className="anim-up" style={{textAlign:"center",padding:"32px 0"}}>
        <div style={{fontSize:48,marginBottom:16}}>{pct>=80?"🏆":pct>=60?"📈":"📚"}</div>
        <div className="result-pct" style={{color:col,marginBottom:8}}>{pct}<span style={{fontSize:40}}>%</span></div>
        <p style={{fontSize:14,color:"var(--muted)",marginBottom:6}}>{sess.c} correct · {sess.w} wrong of {qs.length}</p>
        <p style={{fontSize:13,color:"var(--muted)",marginBottom:28,lineHeight:1.6}}>
          {pct>=80?"Excellent — you've mastered this topic!":pct>=60?"Good progress — review the ones you missed.":"Study the Cheat Sheet first, then try again."}
        </p>
        <button className="btn btn-primary" style={{padding:"13px 28px",fontSize:15}} onClick={load}>Try Again</button>
      </div>
    );
  }

  const q=qs[cur];
  const optClass=(i)=>{let c="opt";if(rev)c+=" locked";if(rev&&i===q.correct)c+=" correct";else if(rev&&i===sel)c+=" wrong";else if(!rev&&i===sel)c+=" selected";return c;};

  return (
    <div className="anim-up" style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <p style={{fontSize:13,fontWeight:500,color:"var(--muted)"}}>Q {cur+1} of {qs.length} · ✓ {sess.c} · ✗ {sess.w}</p>
        <TermLegend/>
      </div>
      <div className="prog"><div className="prog-fill" style={{width:`${(cur/qs.length)*100}%`}}/></div>

      <div className="card card-p">
        <p className="section-label" style={{marginBottom:10,color:"var(--accent-h)"}}>Question</p>
        <RichText text={q.q} style={{fontSize:15,lineHeight:1.7,color:"var(--white)",fontWeight:500,display:"block"}} tag="div"/>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {q.options.map((opt,i)=>(
          <div key={i} className={optClass(i)} onClick={()=>!rev&&setSel(i)} style={{cursor:rev?"default":"pointer"}}>
            <div className="opt-letter">{["A","B","C","D"][i]}</div>
            <RichText text={opt.slice(3)} style={{fontSize:14,lineHeight:1.55,color:rev?(i===q.correct?"var(--green)":i===sel?"var(--red)":"var(--muted2)"):(i===sel?"#818cf8":"var(--text)"),fontWeight:i===sel||i===q.correct?500:400,display:"block"}} tag="div"/>
          </div>
        ))}
      </div>

      {rev&&(
        <div className="card anim-in" style={{borderTop:`2px solid ${sel===q.correct?"var(--green)":"var(--red)"}`,padding:18}}>
          <p className="section-label" style={{marginBottom:8,color:sel===q.correct?"var(--green)":"var(--red)"}}>
            {sel===q.correct?"✓ Correct!":"✗ Incorrect"}
          </p>
          <RichText text={q.explanation} style={{fontSize:14,lineHeight:1.65,color:"var(--text)",display:"block"}} tag="div"/>
        </div>
      )}

      {!rev
        ?<button className="btn btn-primary" style={{width:"100%",padding:"15px",fontSize:15}} disabled={sel===null} onClick={submit}>Submit Answer</button>
        :<button className="btn btn-primary" style={{width:"100%",padding:"15px",fontSize:15}} onClick={next}>{cur+1>=qs.length?"See Results →":"Next Question →"}</button>
      }
    </div>
  );
}

// ─── HOME ─────────────────────────────────────────────────────────────────────
function Home({scores,setScores}) {
  const [mode,setMode]=useState("flashcards");
  const [activeDomain,setActiveDomain]=useState(null);
  const [chips,setChips]=useState([]);
  const [seen,setSeen]=useState([]);
  const [topic,setTopic]=useState("");
  const [view,setView]=useState(null);
  const [shuffling,setShuffling]=useState(false);
  const inputRef=useRef(null);

  useEffect(()=>{
    if(!activeDomain){setChips([]);return;}
    const next=pick10(activeDomain,[]);
    setChips(next);setSeen(next);
  },[activeDomain]);

  const handleShuffle=async()=>{
    if(!activeDomain)return;
    setShuffling(true);
    const all=PRESET[activeDomain]||[];
    if(seen.length>=all.length-4){
      try{const ai=await aiTopics(activeDomain,seen);const next=ai.slice(0,10);setChips(next);setSeen(s=>[...s,...next]);setShuffling(false);return;}catch{}
    }
    const next=pick10(activeDomain,seen);setChips(next);setSeen(s=>[...s,...next]);setShuffling(false);
  };

  const handleGenerate=()=>{
    if(!topic.trim())return;
    setView({mode,domain:activeDomain||"threats",topic:topic.trim()});
  };

  if(view){
    return (
      <div className="anim-up">
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24,flexWrap:"wrap"}}>
          <button className="btn btn-ghost" style={{padding:"8px 14px",fontSize:13}} onClick={()=>setView(null)}>← Back</button>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span className="pill pill-accent">{DOMAINS.find(d=>d.id===view.domain)?.icon} {DOMAINS.find(d=>d.id===view.domain)?.short||"All"}</span>
            <span style={{fontSize:13,fontWeight:600,color:"var(--white)"}}>{view.topic}</span>
          </div>
          <div style={{marginLeft:"auto",display:"flex",gap:6,flexWrap:"wrap"}}>
            {MODES.map(m=>(
              <button key={m.id} className={`btn ${view.mode===m.id?"btn-primary":"btn-ghost"}`}
                style={{padding:"7px 14px",fontSize:12,borderRadius:9}}
                onClick={()=>setView(v=>({...v,mode:m.id}))}>
                {m.icon} {m.label}
              </button>
            ))}
          </div>
        </div>
        {view.mode==="flashcards"&&<Flashcards key={`${view.domain}-${view.topic}-fc`} domain={view.domain} topic={view.topic} scores={scores} setScores={setScores}/>}
        {view.mode==="cheatsheet"&&<CheatSheet key={`${view.domain}-${view.topic}-cs`} domain={view.domain} topic={view.topic}/>}
        {view.mode==="quiz"      &&<Quiz       key={`${view.domain}-${view.topic}-qz`} domain={view.domain} topic={view.topic} scores={scores} setScores={setScores}/>}
      </div>
    );
  }

  return (
    <div className="anim-up" style={{display:"flex",flexDirection:"column",gap:24}}>
      {/* Hero */}
      <div style={{textAlign:"center",paddingTop:12}}>
        <h1 style={{fontSize:"clamp(28px,5vw,46px)",fontWeight:900,color:"var(--white)",letterSpacing:"-.03em",lineHeight:1.08,marginBottom:12}}>
          Master Security+ <span style={{background:"linear-gradient(135deg,#6366f1,#22d3ee)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>faster.</span>
        </h1>
        <p style={{fontSize:15,color:"var(--muted2)",lineHeight:1.6,maxWidth:460,margin:"0 auto"}}>
          Pick a study mode, choose a topic, and let AI build your study materials instantly.
        </p>
      </div>

      {/* Score */}
      {scores.correct+scores.wrong>0&&(
        <div className="card card-p" style={{display:"flex",alignItems:"center",gap:16,justifyContent:"space-between",flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:200}}><ScoreBar scores={scores}/></div>
          <button className="btn btn-ghost" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>setScores({correct:0,wrong:0})}>Reset</button>
        </div>
      )}

      {/* Main card */}
      <div className="card">
        {/* Mode selector */}
        <div className="card-p" style={{paddingBottom:20}}>
          <div className="mode-grid">
            {MODES.map(m=>(
              <button key={m.id} className={`mode-btn${mode===m.id?" active":""}`} onClick={()=>setMode(m.id)}>
                <div className="mode-icon">{m.icon}</div>
                <span className="mode-label">{m.label}</span>
              </button>
            ))}
          </div>
        </div>
        <div className="divider"/>
        <div className="card-p" style={{display:"flex",flexDirection:"column",gap:16}}>
          {/* Domain filter */}
          <div>
            <p className="section-label" style={{marginBottom:10}}>Domain <span style={{color:"var(--border2)"}}>optional</span></p>
            <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
              {DOMAINS.map(d=>(
                <button key={d.id} className={`domain-badge${activeDomain===d.id?" active":""}`}
                  onClick={()=>setActiveDomain(a=>a===d.id?null:d.id)}>
                  <span>{d.icon}</span>{d.short}
                  <span style={{fontSize:11,color:activeDomain===d.id?"#818cf8":"var(--muted)",fontWeight:700}}>{d.pct}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Chips */}
          {chips.length>0&&(
            <div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                <p className="section-label">Suggested Topics</p>
                <button className="btn btn-ghost" style={{padding:"5px 12px",fontSize:12,display:"flex",alignItems:"center",gap:6,borderRadius:8}}
                  disabled={shuffling} onClick={handleShuffle}>
                  <span style={{display:"inline-block",animation:shuffling?"spin .6s linear infinite":"none",fontSize:14}}>⟳</span>
                  {shuffling?"Loading…":"Shuffle"}
                </button>
              </div>
              <div className="chips">
                {chips.map(t=>(
                  <button key={t} className={`chip${topic===t?" active":""}`} onClick={()=>setTopic(t)}>{t}</button>
                ))}
              </div>
            </div>
          )}

          {/* Input */}
          <div>
            <p className="section-label" style={{marginBottom:10}}>Security+ Topic</p>
            <input ref={inputRef} className="topic-input"
              placeholder="e.g. Zero Trust, MFA, PKI, SQL Injection…"
              value={topic} onChange={e=>setTopic(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&handleGenerate()}/>
          </div>

          {/* Generate */}
          <button className="gen-btn" disabled={!topic.trim()} onClick={handleGenerate}>
            <span style={{fontSize:18}}>⚡</span> Generate
          </button>
        </div>
      </div>

      {/* Tip */}
      <div className="exam-tip">
        <span style={{fontSize:16,flexShrink:0}}>⚡</span>
        <div><strong style={{color:"var(--yellow)"}}>Exam Watch:</strong> Implementation (25%) and Threats (24%) make up nearly half the exam. Prioritize these domains first.</div>
      </div>
    </div>
  );
}
